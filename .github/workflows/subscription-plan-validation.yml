name: Subscription Plan Validation

on:
  push:
    branches:
      - 'bugfix/**'
      - 'feature/**'
  pull_request:
    branches:
      - main
    paths:
      - 'src/billing/**'
      - 'src/routes/platform.js'
      - 'tests/billing/**'
      - '.github/workflows/subscription-plan-validation.yml'

jobs:
  subscription-tests:
    name: Subscription billing regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run plan change and billing tests
        run: npx jest --runInBand --forceExit tests/billing/planChangeImpact.test.js tests/billing/subscriptionRenewalComposition.test.js tests/billing/planCreditStatus.test.js tests/billing/workspaceAddonBilling.test.js tests/billing/subscriptions/earlyTrialPaidCredits.test.js tests/billing/subscriptions/periodActivationAccess.test.js tests/billing/subscriptions/lifecycleService.test.js
