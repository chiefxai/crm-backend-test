# Production deployment stack
#
# External services:
#   - AWS S3
#   - AWS Cognito
#   - Google Vertex AI
#
# VM-local containers:
#   - Express API
#   - Scheduler process
#   - MySQL
#   - Redis
#   - ChromaDB
#   - RabbitMQ (job queue broker — see src/queue/adapters/rabbitMqQueueAdapter.js)
#   - Caddy

services:
  app:
    build: .
    restart: unless-stopped
    env_file:
      - path: .env
        required: true
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      DB_ADAPTER: mysql
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      QUEUE_PROVIDER: ${QUEUE_PROVIDER:-rabbitmq}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_URL: redis://redis:6379
      CHROMA_URL: http://chroma-db:8000
    ports:
      - "${APP_HOST_PORT:-3000}:3000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      chroma-db:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    networks: [internal]

  scheduler:
    build: .
    restart: unless-stopped
    command: ["node", "scheduler.js"]
    env_file:
      - path: .env
        required: true
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      SCHEDULER_PROVIDER: local
      QUEUE_PROVIDER: ${QUEUE_PROVIDER:-rabbitmq}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_URL: redis://redis:6379
      CHROMA_URL: http://chroma-db:8000
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks: [internal]

  # Dedicated durable callback scheduler. It owns ONLY callback/retry
  # timing; the API container can crash or be redeployed without losing the
  # callback schedule. Due callbacks are persisted in MySQL and dispatched
  # through the durable RabbitMQ queue to the API worker.
  #
  # Future AWS migration: replace this container with EventBridge Scheduler
  # targeting the same provider-agnostic callback schedule/dispatch contract.
  callback-scheduler:
    build:
      context: .
      dockerfile: callback-scheduler.Dockerfile
    restart: unless-stopped
    command: ["node", "callback-scheduler.js"]
    env_file:
      - path: .env
        required: true
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      SCHEDULER_PROVIDER: bullmq
      CALLBACK_SCHEDULER_RECONCILE_MS: ${CALLBACK_SCHEDULER_RECONCILE_MS:-60000}
      CALLBACK_SCHEDULER_QUEUE: ${CALLBACK_SCHEDULER_QUEUE:-crm-callback-scheduler}
      CALLBACK_SCHEDULER_CONCURRENCY: ${CALLBACK_SCHEDULER_CONCURRENCY:-1}
      QUEUE_PROVIDER: ${QUEUE_PROVIDER:-rabbitmq}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_URL: redis://redis:6379
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks: [internal]

  # Dedicated worker for organization data-retention cleanup and scheduled
  # backup processing. It runs the retention cycle immediately at startup and
  # then once daily at 03:00 server time.
  retention-worker:
    build: .
    restart: unless-stopped
    command: ["node", "retention-worker.js"]
    env_file:
      - path: .env
        required: true
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DB_ADAPTER: mysql
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      QUEUE_PROVIDER: ${QUEUE_PROVIDER:-rabbitmq}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_URL: redis://redis:6379
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks: [internal]

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -u root -p${MYSQL_ROOT_PASSWORD} --silent"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [internal]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [internal]

  chroma-db:
    image: chromadb/chroma:latest
    restart: unless-stopped
    volumes:
      - chroma_data:/chroma/chroma
    networks: [internal]

  # Durable job queue broker — bridges autoDialEngine's placeDial jobs
  # (and any other queue traffic) from the scheduler container, which only
  # ever publishes, to the app container, which registers the actual
  # processors (see src/queue/adapters/rabbitMqQueueAdapter.js). Not
  # reachable outside the internal network: no AMQP or management port is
  # published to the host, matching mysql/redis/chroma-db's existing
  # internal-only pattern.
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    restart: unless-stopped
    environment:
      # The image's default `guest` user only accepts localhost
      # connections — that fails from app/scheduler, which reach this
      # broker over the internal Docker network, not loopback. Required
      # in .env, same pattern as MYSQL_USER/MYSQL_PASSWORD above; never
      # defaulted here and never committed.
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [internal]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    depends_on:
      - app
    networks: [internal]

networks:
  internal:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
  chroma_data:
  rabbitmq_data:
  caddy_data:
  caddy_config: